id: TP-H10
title: DNS tunnelling or DGA — high-entropy / high-volume subdomains
hypothesis: >
  If data is being exfiltrated or C2 is carried over DNS, a host will query many
  unique, long, high-entropy subdomains under one parent domain.
severity: high
mitre: [T1071.004, T1048.003, T1568.002]
type: analytic
analytic: dns_tunnel
logsource: {channel: sysmon, event_id: 22}
params:
  window: 300
  min_label_len: 24
  min_entropy: 3.5
  suspicious_queries: 8       # long+high-entropy queries per parent domain per window
  unique_subdomains: 80       # or: this many unique subdomains per parent domain per window
  allow_domains: [microsoft.com, windows.com, windowsupdate.com, office.com, office365.com, live.com,
                  akamaiedge.net, akadns.net, cloudfront.net, amazonaws.com, googleapis.com, gstatic.com,
                  azureedge.net, trafficmanager.net, digicert.com, sophosxl.net, mcafee.com]
