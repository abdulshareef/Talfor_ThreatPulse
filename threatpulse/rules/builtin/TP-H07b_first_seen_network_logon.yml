id: TP-H07b
title: First-seen network logon — possible valid-account abuse
hypothesis: >
  If stolen credentials are being reused, an account will authenticate over the
  network to a host it has never logged on to before. The first-seen relationship
  is the behavioural analytic; T1078 is the hypothesis it tests.
severity: medium
mitre: [T1078]
type: analytic
analytic: first_seen
logsource: {channel: security, event_id: 4624}
params:
  fields: [TargetUserName, Computer]
  min_baseline: 15      # distinct pairs observed before this rule may fire
detection:
  network_logon:
    LogonType: ['3', '10']
  machine_accounts:
    TargetUserName|endswith: '$'
  anonymous:
    TargetUserName: ['anonymous logon', '-']
  condition: network_logon and not machine_accounts and not anonymous
falsepositives:
  - New staff, new servers, role changes (learned after first sight)
