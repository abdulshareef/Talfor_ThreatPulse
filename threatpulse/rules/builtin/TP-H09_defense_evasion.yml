id: TP-H09
title: Anti-forensics — event log clearing or security tool tampering
hypothesis: >
  If an attacker is covering tracks, event logs will be cleared or Defender /
  Sysmon will be disabled, excluded or stopped.
severity: critical
mitre: [T1070.001, T1562.001, T1562.002]
logsource:
  - {channel: sysmon, event_id: 1}
  - {channel: security, event_id: 4688}
  - {channel: security, event_id: 1102}
  - {channel: system, event_id: 104}
  - {channel: defender, event_id: 5001}
  - {channel: defender, event_id: 5013}
detection:
  log_cleared:
    EventID: [1102, 104]
  defender_disabled:
    EventID: [5001, 5013]
  wevtutil:
    tp_image: wevtutil.exe
    CommandLine|re: '\s(cl|clear-log)\s'
  ps_clear:
    CommandLine|contains: ['clear-eventlog', 'remove-eventlog', 'limit-eventlog']
  defender_tamper:
    CommandLine|contains: ['disablerealtimemonitoring', 'disableioavprotection', 'disablebehaviormonitoring',
                           'add-mppreference -exclusionpath', 'add-mppreference -exclusionprocess']
  service_kill:
    tp_image: [sc.exe, net.exe, net1.exe]
    CommandLine|contains: ['stop windefend', 'stop sysmon', 'delete sysmon', 'windefend start= disabled']
  condition: 1 of them
