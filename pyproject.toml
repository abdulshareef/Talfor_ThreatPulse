[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talfor-threatpulse"
dynamic = ["version"]
description = "Hybrid rule + self-learning threat hunting engine for Windows telemetry, with forensic-grade evidence handling."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Dr. Abdul Shareef Pallivalappil", email = "digit46inv@gmail.com"}]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
keywords = ["threat-hunting", "dfir", "sigma", "sysmon", "anomaly-detection", "mitre-attack", "forensics"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
  "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
evtx = ["python-evtx>=0.7"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
threatpulse = "threatpulse.cli:main"

[project.urls]
Homepage = "https://github.com/abdulshareef/Talfor_ThreatPulse"
Company = "https://talfor.in"

[tool.setuptools.dynamic]
version = {attr = "threatpulse.__version__"}

[tool.setuptools.packages.find]
include = ["threatpulse*"]

[tool.setuptools.package-data]
threatpulse = ["rules/builtin/*.yml", "rules/drafts/.gitkeep"]
